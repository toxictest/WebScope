config_version=1
dns_rate=2
http_rate=1
concurrency=1
timeout=8
max_duration=900
max_assets=128
retention_runs=30
retention_baselines=8
tls_critical_days=15
allow_nonpublic=false
allow_public_dns=true
ct_enabled=false
http_body_preview=false
follow_redirects=false
cloud_listing_verification=false
resolver=system
